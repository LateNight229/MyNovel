<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Glass Novel Library</title>

<!-- =========================
        CSS
========================= -->
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

html{
    scroll-behavior:smooth;
}

:root{

    --bg1:#020617;
    --bg2:#111827;

    --glass:rgba(255,255,255,0.08);
    --glass-border:rgba(255,255,255,0.12);

    --text:#ffffff;
    --muted:#94a3b8;

    --accent:#60a5fa;

    --shadow:0 10px 30px rgba(0,0,0,0.25);

}

body.light-mode{
    --bg1:#dbeafe;
    --bg2:#f8fafc;

    --glass:rgba(255,255,255,0.55);
    --glass-border:rgba(255,255,255,0.4);

    --text:#0f172a;
    --muted:#475569;
}


/* ========= LIGHT ========= */

body.light-mode{

    --bg1:#dbeafe;
    --bg2:#f8fafc;

    --glass:rgba(255,255,255,0.55);
    --glass-border:rgba(255,255,255,0.45);

    --text:#0f172a;
    --muted:#475569;

    --accent:#3b82f6;

    --shadow:
    0 10px 30px rgba(0,0,0,0.10);

}

body{
    background:
    radial-gradient(circle at top left,
    rgba(255,255,255,0.06),
    transparent 30%),

    radial-gradient(circle at bottom right,
    rgba(255,255,255,0.05),
    transparent 30%),

    linear-gradient(
        135deg,
        var(--bg1),
        var(--bg2)
    );
}

/* =========================
        BG ORB
========================= */

.bg-orb{
    position:fixed;
    width:420px;
    height:420px;
    border-radius:50%;
    filter:blur(110px);
    opacity:0.55;
    z-index:0;
    transition:0.5s;
}

.orb1{
    background:var(--accent);
    top:-120px;
    left:-120px;
}

.orb2{
    background:var(--accent);
    bottom:-120px;
    right:-120px;
}

/* =========================
        LAYOUT
========================= */

.app{
    position:relative;
    z-index:2;

    display:grid;
    grid-template-columns:280px 1fr;

    gap:20px;

    width:min(1400px,95vw);

    margin:auto;
    padding:20px;
}

/* =========================
        SIDEBAR
========================= */

.sidebar{
    position:sticky;
    top:20px;

    height:fit-content;

    padding:20px;

    border-radius:24px;

    background:var(--glass);

    border:1px solid var(--glass-border);

    backdrop-filter:blur(20px);

    box-shadow:var(--shadow);
}

.logo{
    font-size:28px;
    font-weight:800;

    margin-bottom:20px;
}

.logo span{
    color:var(--accent);
}

.nav-group{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.btn{
    border:none;
    outline:none;

    background:rgba(255,255,255,0.06);

    border:1px solid var(--glass-border);

    color:var(--text);

    border-radius:16px;

    padding:14px;

    cursor:pointer;

    transition:0.25s;

    backdrop-filter:blur(12px);
}

.btn:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,0.12);
}

.search-box{
    margin-top:20px;
}

.search-box input{
    width:100%;
    height:48px;

    border:none;
    outline:none;

    border-radius:14px;

    padding:0 14px;

    background:rgba(255,255,255,0.08);

    color:var(--text);
}

/* =========================
        MAIN
========================= */

.main{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.panel{
    background:var(--glass);

    border:1px solid var(--glass-border);

    backdrop-filter:blur(20px);

    border-radius:24px;

    padding:20px;

    animation:fadeIn 0.35s ease;

    box-shadow:var(--shadow);
}

.section-title{
    font-size:24px;
    font-weight:700;

    margin-bottom:20px;
}

/* =========================
        CARD
========================= */

.card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:18px;
}

.card{
    background:rgba(255,255,255,0.06);

    border:1px solid var(--glass-border);

    border-radius:20px;

    overflow:hidden;

    transition:0.25s;

    cursor:pointer;

    position:relative;

    backdrop-filter:blur(18px);
    box-shadow:var(--shadow);
}

.card:hover{
    transform:translateY(-4px) scale(1.01);
}

.card-body{
    padding:16px;
}

.card-title{
    font-size:18px;
    font-weight:700;

    margin-bottom:8px;
}

.card-desc{
    font-size:14px;
    color:var(--muted);

    margin-bottom:6px;
}

.card-actions{
    display:flex;
    gap:10px;

    margin-top:16px;
}

.action-btn{
    flex:1;
}

/* =========================
        READER
========================= */

.reader-content{
    white-space:pre-wrap;
    line-height:1.8;

    font-size:17px;
}

/* =========================
        MODAL
========================= */

.modal{
    position:fixed;
    inset:0;

    z-index:999;

    display:none;
}

.modal.active{
    display:block;
}

.modal-overlay{
    position:absolute;
    inset:0;

    background:rgba(0,0,0,0.6);

    backdrop-filter:blur(4px);
}

.modal-box{
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:min(500px,92vw);

    background:rgba(15,23,42,0.95);

    border:1px solid var(--glass-border);

    border-radius:24px;

    padding:24px;

    display:flex;
    flex-direction:column;
    gap:14px;

    animation:popup 0.25s ease;
}

body.light-mode .modal-box{
    background:white;
}

.modal-title{
    font-size:24px;
    font-weight:700;
}

.modal-box input,
.modal-box textarea,
.modal-box select{
    width:100%;

    border:none;
    outline:none;

    border-radius:14px;

    padding:14px;

    background:rgba(255,255,255,0.08);

    color:var(--text);
}

.modal-box textarea{
    min-height:120px;
    resize:vertical;
}

/* =========================
        CONFIRM
========================= */

.confirm-buttons{
    display:flex;
    gap:12px;
}

/* =========================
        ANIMATION
========================= */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes popup{
    from{
        opacity:0;
        transform:translate(-50%,-46%);
    }
    to{
        opacity:1;
        transform:translate(-50%,-50%);
    }
}

/* =========================
        MOBILE
========================= */

@media(max-width:900px){

    .app{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:static;
    }

}

</style>
</head>
<body>

<!-- =========================
        BG EFFECT
========================= -->

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<!-- =========================
        APP
========================= -->

<div class="app">

    <!-- =========================
            SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="logo">
            Glass <span>Novel</span>
        </div>

        <div class="nav-group">

            <button class="btn" onclick="showPanel('offlinePanel')">
                📚 Offline Novel
            </button>

            <button class="btn" onclick="showPanel('onlinePanel')">
                🌐 Online Novel
            </button>

            <button class="btn" onclick="openAddTypeModal()">
                ➕ Add Novel
            </button>

            <button class="btn" onclick="openParseModal()">
                🔎 Parse Link
            </button>

            <button class="btn" onclick="toggleMode()">
                🌗 Dark / Light
            </button>
            </button>

        </div>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search novel..."
                oninput="searchNovel()"
            />
        </div>

    </aside>

    <!-- =========================
            MAIN
    ========================= -->

    <main class="main">

        <!-- OFFLINE -->

        <section class="panel" id="offlinePanel">

            <div class="section-title">
                📚 Offline Novel
            </div>

            <div class="card-grid" id="offlineGrid"></div>

        </section>

        <!-- ONLINE -->

        <section class="panel" id="onlinePanel" style="display:none;">

            <div class="section-title">
                🌐 Online Novel
            </div>

            <div class="card-grid" id="onlineGrid"></div>

        </section>

        <!-- READER -->

        <section class="panel" id="readerPanel" style="display:none;">

            <div class="section-title" id="readerTitle">
                Reader
            </div>

            <div class="reader-content" id="readerContent"></div>

        </section>

    </main>

</div>

<!-- =========================
        ADD TYPE MODAL
========================= -->

<div class="modal" id="typeModal">

    <div class="modal-overlay" onclick="closeModal('typeModal')"></div>

    <div class="modal-box">

        <div class="modal-title">
            Add Novel
        </div>

        <button class="btn" onclick="openOnlineModal()">
            🌐 Add Online Novel
        </button>

        <button class="btn" onclick="triggerOfflineUpload()">
            📚 Add Offline Novel
        </button>

    </div>

</div>

<!-- =========================
        ONLINE MODAL
========================= -->

<div class="modal" id="onlineModal">

    <div class="modal-overlay" onclick="closeModal('onlineModal')"></div>

    <div class="modal-box">

        <div class="modal-title">
            Add Online Novel
        </div>

        <input type="text" id="onlineTitle" placeholder="Novel Title">

        <input type="text" id="onlineStatus" placeholder="Status">

        <input type="text" id="onlineChapter" placeholder="Current Chapter">

        <input type="text" id="onlineLink" placeholder="Novel Link">

        <textarea id="onlineNote" placeholder="Notes"></textarea>

        <button class="btn" onclick="saveOnlineNovel()">
            Add To Library
        </button>

    </div>

</div>

<!-- =========================
        PARSE MODAL
========================= -->

<div class="modal" id="parseModal">

    <div class="modal-overlay"
         onclick="closeModal('parseModal')"></div>

    <div class="modal-box">

        <div class="modal-title">
            Parse Novel Link
        </div>

        <input
            type="text"
            id="parseLinkInput"
            placeholder="Paste novel chapter link..."
        >

        <button class="btn"
                onclick="parseNovelLink()">
            Parse
        </button>

        <textarea
            id="parseResult"
            placeholder="Parsed content will appear here..."
        ></textarea>

        <button class="btn"
                onclick="copyParsedContent()">
            📋 Copy Content
        </button>

    </div>

</div>

<!-- =========================
        CONFIRM MODAL
========================= -->

<div class="modal" id="confirmModal">

    <div class="modal-overlay"></div>

    <div class="modal-box">

        <div class="modal-title">
            Novel Added Successfully
        </div>

        <p>
            Chuyển tiếp tới Library?
        </p>

        <div class="confirm-buttons">

            <button class="btn" onclick="goToLibrary()">
                OK
            </button>

            <button class="btn" onclick="continueAdd()">
                No
            </button>

        </div>

    </div>

</div>

<!-- hidden file input -->

<input
    type="file"
    id="offlineFileInput"
    accept=".txt"
    style="display:none"
/>

<!-- =========================
        JAVASCRIPT
========================= -->


<script>

/* =========================
        STORAGE
========================= */

let onlineNovels =
JSON.parse(localStorage.getItem("onlineNovels")) || [];

let offlineNovels =
JSON.parse(localStorage.getItem("offlineNovels")) || [];

function saveStorage(){

    localStorage.setItem(
        "onlineNovels",
        JSON.stringify(onlineNovels)
    );

    localStorage.setItem(
        "offlineNovels",
        JSON.stringify(offlineNovels)
    );

}

/* =========================
        PANEL
========================= */

function showPanel(panelId){

    document.getElementById("offlinePanel").style.display = "none";
    document.getElementById("onlinePanel").style.display = "none";
    document.getElementById("readerPanel").style.display = "none";

    document.getElementById(panelId).style.display = "block";

}

/* =========================
        THEME
========================= */

function toggleMode(){

    document.body.classList.toggle("light-mode");

}

// function setTheme(theme){

//     document.body.classList.remove(
//         "theme-blue"
//     );

//     document.body.classList.add(theme);

// }

/* =========================
        MODAL
========================= */

function openAddTypeModal(){

    document
    .getElementById("typeModal")
    .classList.add("active");

}

function openOnlineModal(){

    closeModal("typeModal");

    document
    .getElementById("onlineModal")
    .classList.add("active");

}

function closeModal(id){

    document
    .getElementById(id)
    .classList.remove("active");

}

/* =========================
        ONLINE NOVEL
========================= */

function saveOnlineNovel(){

    const title =
    document.getElementById("onlineTitle").value;

    const status =
    document.getElementById("onlineStatus").value;

    const chapter =
    document.getElementById("onlineChapter").value;

    const link =
    document.getElementById("onlineLink").value;

    const note =
    document.getElementById("onlineNote").value;

    if(!title || !link){

        alert("Please input title and link");
        return;

    }

    onlineNovels.unshift({

        id:Date.now(),

        title,
        status,
        chapter,
        link,
        note

    });

    saveStorage();

    renderOnline();

    closeModal("onlineModal");

    document
    .getElementById("confirmModal")
    .classList.add("active");

}

/* =========================
        OFFLINE NOVEL
========================= */

function triggerOfflineUpload(){

    closeModal("typeModal");

    document
    .getElementById("offlineFileInput")
    .click();

}

document
.getElementById("offlineFileInput")
.addEventListener("change",async function(event){

    const file = event.target.files[0];

    if(!file) return;

    const text = await file.text();

    offlineNovels.unshift({

        id:Date.now(),

        title:file.name,

        content:text,

        chapter:"Offline File",

        status:"Reading"

    });

    saveStorage();

    renderOffline();

    document
    .getElementById("confirmModal")
    .classList.add("active");

});

/* =========================
        RENDER ONLINE
========================= */

function renderOnline(data = onlineNovels){

    const grid =
    document.getElementById("onlineGrid");

    grid.innerHTML = "";

    if(data.length === 0){

        grid.innerHTML =
        `<div>No Online Novel</div>`;

        return;

    }

    data.forEach(novel=>{

        const card =
        document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div class="card-body">

                <div class="card-title">
                    ${novel.title}
                </div>

                <div class="card-desc">
                    📌 ${novel.status || "-"}
                </div>

                <div class="card-desc">
                    📖 ${novel.chapter || "-"}
                </div>

                <div class="card-desc">
                    ${novel.note || ""}
                </div>

                <div class="card-actions">

                    <button
                        class="btn action-btn"
                        onclick="openNovelLink('${novel.link}')"
                    >
                        Open
                    </button>

                    <button
                        class="btn action-btn"
                        onclick="editOnline(${novel.id})"
                    >
                        Edit
                    </button>

                    <button
                        class="btn action-btn"
                        onclick="deleteOnline(${novel.id})"
                    >
                        Delete
                    </button>

                </div>

            </div>

        `;

        grid.appendChild(card);

    });

}

/* =========================
        RENDER OFFLINE
========================= */

function renderOffline(data = offlineNovels){

    const grid =
    document.getElementById("offlineGrid");

    grid.innerHTML = "";

    if(data.length === 0){

        grid.innerHTML =
        `<div>No Offline Novel</div>`;

        return;

    }

    data.forEach(novel=>{

        const card =
        document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div class="card-body">

                <div class="card-title">
                    ${novel.title}
                </div>

                <div class="card-desc">
                    📖 ${novel.chapter}
                </div>

                <div class="card-desc">
                    📌 ${novel.status}
                </div>

                <div class="card-actions">

                    <button
                        class="btn action-btn"
                        onclick="readOffline(${novel.id})"
                    >
                        Read
                    </button>

                    <button
                        class="btn action-btn"
                        onclick="editOffline(${novel.id})"
                    >
                        Edit
                    </button>

                    <button
                        class="btn action-btn"
                        onclick="deleteOffline(${novel.id})"
                    >
                        Delete
                    </button>

                </div>

            </div>

        `;

        grid.appendChild(card);

    });

}

/* =========================
        READER
========================= */

function readOffline(id){

    const novel =
    offlineNovels.find(n=>n.id === id);

    if(!novel) return;

    showPanel("readerPanel");

    document
    .getElementById("readerTitle")
    .textContent = novel.title;

    document
    .getElementById("readerContent")
    .textContent = novel.content;

}

/* =========================
        DELETE
========================= */

function deleteOnline(id){

    onlineNovels =
    onlineNovels.filter(n=>n.id !== id);

    saveStorage();

    renderOnline();

}

function deleteOffline(id){

    offlineNovels =
    offlineNovels.filter(n=>n.id !== id);

    saveStorage();

    renderOffline();

}

/* =========================
        EDIT
========================= */

function editOnline(id){

    const novel =
    onlineNovels.find(n=>n.id === id);

    if(!novel) return;

    const title =
    prompt("Edit Title",novel.title);

    if(title === null) return;

    novel.title = title;

    saveStorage();

    renderOnline();

}

function editOffline(id){

    const novel =
    offlineNovels.find(n=>n.id === id);

    if(!novel) return;

    const title =
    prompt("Edit Title",novel.title);

    if(title === null) return;

    novel.title = title;

    saveStorage();

    renderOffline();

}

/* =========================
        SEARCH
========================= */

function searchNovel(){

    const value =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase();

    const onlineFiltered =
    onlineNovels.filter(n=>
        n.title.toLowerCase().includes(value)
    );

    const offlineFiltered =
    offlineNovels.filter(n=>
        n.title.toLowerCase().includes(value)
    );

    renderOnline(onlineFiltered);

    renderOffline(offlineFiltered);

}

/* =========================
        OPEN LINK
========================= */

function openNovelLink(link){

    window.open(link,"_blank");

}

/* =========================
        CONFIRM ACTION
========================= */

function goToLibrary(){

    closeModal("confirmModal");

    showPanel("onlinePanel");

}

function continueAdd(){

    closeModal("confirmModal");

}

/* =========================
        PARSE LINK
========================= */

function openParseModal(){

    document
    .getElementById("parseModal")
    .classList.add("active");

}

async function parseNovelLink(){

    const link =
    document.getElementById(
        "parseLinkInput"
    ).value;

    if(!link){

        alert("Please input link");
        return;

    }

    const resultBox =
    document.getElementById(
        "parseResult"
    );

    resultBox.value =
    "Parsing content...";

    try{

        const response =
        await fetch(
            "https://api.allorigins.win/raw?url=" +
            encodeURIComponent(link)
        );

        const html =
        await response.text();

        const parser =
        new DOMParser();

        const doc =
        parser.parseFromString(
            html,
            "text/html"
        );

        const selectors = [

            ".chapter-content",
            "#chapter-content",
            ".reading-content",
            ".entry-content",
            ".chapter-c"

        ];

        let content = "";

        for(const selector of selectors){

            const el =
            doc.querySelector(selector);

            if(el){

                content =
                el.innerText;

                break;

            }

        }

        if(!content){

            content =
            doc.body.innerText
            .slice(0,5000);

        }

        resultBox.value = content;

    }
    catch(err){

        resultBox.value =
        "FAILED:\n\n" + err;

    }

}

function copyParsedContent(){

    const text =
    document.getElementById(
        "parseResult"
    ).value;

    navigator.clipboard.writeText(text);

    alert("Copied!");

}

/* =========================
        INIT
========================= */

renderOnline();
renderOffline();

</script>

</body>
</html>
